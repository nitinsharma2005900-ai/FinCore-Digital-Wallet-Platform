# Replace fincore.example.com and provision certificate paths before enabling.
server {
 listen 80;
 server_name fincore.example.com;
 location / { return 301 https://$host$request_uri; }
}
server {
 listen 443 ssl;
 server_name fincore.example.com;
 ssl_certificate /etc/letsencrypt/live/fincore.example.com/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/fincore.example.com/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 add_header Strict-Transport-Security "max-age=31536000" always;
 client_max_body_size 100k;
 location /api/ { proxy_pass http://127.0.0.1:4000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_read_timeout 15s; }
 location / { proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
}
