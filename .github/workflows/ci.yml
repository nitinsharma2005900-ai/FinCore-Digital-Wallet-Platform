name: Financial quality gates
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_PASSWORD: ci_synthetic_password, POSTGRES_DB: fincore_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://fincore_app:ci_app_password@localhost:5432/fincore_test
      TEST_DATABASE_URL: postgresql://fincore_app:ci_app_password@localhost:5432/fincore_test
      MIGRATION_DATABASE_URL: postgresql://postgres:ci_synthetic_password@localhost:5432/fincore_test
      PSQL_BIN: psql
      REDIS_URL: redis://localhost:6379
      FASTAPI_SERVICE_URL: http://localhost:8000
      WEB_ORIGIN: http://127.0.0.1:3000
      INTERNAL_SERVICE_SECRET: ci_synthetic_internal_secret_32_characters
      JWT_ACCESS_SECRET: ci_synthetic_access_secret_32_characters
      JWT_REFRESH_SECRET: ci_synthetic_refresh_secret_32_characters
      MFA_SECRET: ci_synthetic_mfa_secret_32_characters
      LOCAL_WEBHOOK_SECRET: ci_synthetic_webhook_secret_32_characters
      DEMO_PASSWORD: CI_Synthetic_Demo_2026
      SEED_DEMO: "true"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: npm ci
      - run: pip install -r services/financial-analytics/requirements.txt
      - run: psql "$MIGRATION_DATABASE_URL" -c "CREATE ROLE fincore_app LOGIN PASSWORD 'ci_app_password'"
      - run: npm run db:generate && npm run db:migrate && npm run db:seed
      - run: python -m uvicorn app:app --app-dir services/financial-analytics --port 8000 > evidence/analytics-ci.txt 2>&1 &
      - run: node scripts/wait-for-services.mjs http://127.0.0.1:8000/health
      - run: npm run lint && npm run typecheck && npm test
      - run: python -m pytest services/financial-analytics --junitxml=evidence/python-tests.xml
      - run: npm run build && npm run docs
      - run: npm audit --audit-level=high
      - run: pip-audit -r services/financial-analytics/requirements.txt
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
      - run: npx playwright install --with-deps chromium
      - run: node --import tsx apps/api/src/server.ts & npm run dev:web & node scripts/wait-for-services.mjs && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'fincore-evidence-${{ github.sha }}', path: 'evidence/'}
  images:
    runs-on: ubuntu-latest
    permissions: {contents: read, id-token: write, attestations: write}
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infrastructure/docker/Node.Dockerfile -t fincore:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@0.35.0
        with: {image-ref: 'fincore:${{ github.sha }}', severity: 'CRITICAL,HIGH', exit-code: '1'}
      - run: docker save fincore:${{ github.sha }} -o fincore-image.tar
      - uses: actions/attest-build-provenance@v2
        if: github.event.repository.private == false
        with: {subject-path: fincore-image.tar}
      - uses: actions/upload-artifact@v4
        with: {name: 'fincore-image-${{ github.sha }}', path: fincore-image.tar}
