name: fincore
x-node-build: &node-build
  context: .
  dockerfile: infrastructure/docker/Node.Dockerfile
  args:
    NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:4001/api/v1}
    NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
x-app-env: &app-env
  NODE_ENV: development
  HOST: 0.0.0.0
  PORT: 4000
  DATABASE_URL: postgresql://fincore_app:${DATABASE_PASSWORD:?Run setup to generate DATABASE_PASSWORD}@postgres:5432/fincore
  MIGRATION_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Run setup to generate POSTGRES_PASSWORD}@postgres:5432/fincore
  REDIS_URL: redis://redis:6379
  FASTAPI_SERVICE_URL: http://analytics:8000
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: fincore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/init-db.sh:/docker-entrypoint-initdb.d/10-fincore.sh:ro
    healthcheck: {test: [CMD-SHELL, "pg_isready -U postgres -d fincore"], interval: 5s, timeout: 3s, retries: 20}
    restart: unless-stopped
    networks: [private]
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    volumes: [redisdata:/data]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 20}
    restart: unless-stopped
    networks: [private]
  mailpit:
    image: axllent/mailpit:v1.34.0
    ports: ["127.0.0.1:8025:8025"]
    restart: unless-stopped
    networks: [private, egress]
  analytics:
    build: {context: ., dockerfile: infrastructure/docker/Analytics.Dockerfile}
    env_file: .env
    ports: ["127.0.0.1:${ANALYTICS_HOST_PORT:-8001}:8000"]
    healthcheck: {test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"], interval: 10s, timeout: 5s, retries: 10}
    restart: unless-stopped
    networks: [private, egress]
  migrate:
    image: fincore-node:local
    build: *node-build
    env_file: .env
    environment: *app-env
    command: [sh, -c, "node dist/scripts/migrate.js && node dist/database/seeds/seed.js"]
    depends_on: {postgres: {condition: service_healthy}}
    networks: [private]
  api:
    image: fincore-node:local
    pull_policy: never
    env_file: .env
    environment: *app-env
    ports: ["127.0.0.1:${API_HOST_PORT:-4001}:4000"]
    depends_on: {migrate: {condition: service_completed_successfully}, redis: {condition: service_healthy}, analytics: {condition: service_healthy}}
    healthcheck: {test: [CMD, node, -e, "fetch('http://localhost:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 10s, timeout: 5s, retries: 10}
    restart: unless-stopped
    networks: [private, egress]
  worker:
    image: fincore-node:local
    pull_policy: never
    env_file: .env
    environment: *app-env
    command: [node, dist/apps/worker/src/index.js]
    healthcheck: {test: [CMD, node, -e, "fetch('http://localhost:8081').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 10s, timeout: 5s, retries: 10}
    depends_on: {api: {condition: service_healthy}}
    restart: unless-stopped
    networks: [private, egress]
  web:
    image: fincore-node:local
    pull_policy: never
    command: [node, scripts/start-web.cjs]
    ports: ["127.0.0.1:3000:3000"]
    depends_on: {api: {condition: service_healthy}}
    healthcheck: {test: [CMD, node, -e, "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 10s, timeout: 5s, retries: 10}
    restart: unless-stopped
    networks: [private, egress]
volumes: {pgdata: {}, redisdata: {}}
networks:
  private: {internal: true}
  egress: {}
